<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>いのTの国語資料室</title>

<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="moving-bg"></div>
<div id="sakura-container"></div>

<header class="hero">
<h1 class="ink-title">
<span>い</span><span>の</span><span>T</span><span>の</span>
<span>国</span><span>語</span><span>資</span><span>料</span><span>室</span>
</h1>
</header>

<main>

<section class="vertical-section">
<h2 class="section-title">中学教材</h2>

<div class="card">
<div class="gold-overlay"></div>
<div class="card-content">
<div class="thumb"></div>
<p class="card-text">前期中間対策プリント</p>
</div>
</div>

<div class="card">
<div class="gold-overlay"></div>
<div class="card-content">
<div class="thumb"></div>
<p class="card-text">古典読解講座</p>
</div>
</div>
</section>

<section class="vertical-section">
<h2 class="section-title">漢字クイズ</h2>

<div class="quiz-box">
<p id="quiz-question"></p>
<div id="quiz-choices"></div>
<button id="next-btn">次へ</button>
<div id="retry-area">
<button id="retry-same">同じ問題で再挑戦</button>
<button id="retry-new">問題を変えて再挑戦</button>
</div>
<p id="quiz-result"></p>
<div id="review-box"></div>
</div>

</section>

</main>

<script src="script.js"></script>
</body>
</html>
